<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/icons/font/bootstrap-icons.min.css">
</head>

<body>


    <div class="banner">
        <div class="flex justify-between">
            <div>
                <p class="inline-block">Hostname: </p>
                <p class="inline-block">Demo Machine</p>
            </div>
            <div>
                <button class="btn btn-secondary">Console</button>
                <button class="btn btn-primary">Active</button>
                <button class="btn btn-primary">1 day</button>
                <button class="btn btn-primary">English</button>
            </div>
        </div>
    </div>


    <section>
        <div class="grid grid-cols-2">
            <div class="border-secondary rounded p-5">information</div>
            <div class="grid grid-cols-2">
                <div class="border-secondary rounded p-5">
                    <div>
                        <i class="bi bi-sd-card"></i>
                        <p class="inline">Memory</p>
                    </div>
                    <div>
                        <p>
                            <span class="text-primary text-lg">2048</span>
                            <span class="text-sm">MB</span>
                        </p>
                    </div>
                </div>
                <div class="border-secondary rounded p-5">
                    <div>
                        <i class="bi bi-cpu"></i>
                        <p class="inline" >CPU</p>
                    </div>
                    <div>
                        <p>
                            <span class="text-primary text-lg">2</span> 
                            <span class="text-sm">Core</span>
                        </p>
                    </div>
                </div>
                <div class="border-secondary rounded p-5">
                    <div>
                        <i class="bi bi-hdd"></i>
                        <p class="inline">Disk</p>
                    </div>
                    <div>
                        <p>
                            <span class="text-primary text-lg">2</span> 
                            <span class="text-sm">TB</span>
                        </p>
                    </div>
                </div>
                <div class="border-secondary rounded p-5">
                    <div>
                        <i class="bi bi-heptagon"></i>
                        <p class="inline">Template</p>
                    </div>
                    <div>
                        <p>
                            <span class="text-primary text-lg">
                                Windows 11
                            </span>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </section>




</body>

</html>
